# ============================================================================
# MEGANv3.1 site-scale Python model namelist
#
# Edit this file to configure a run.  main_program.py should not need editing.
# Relative paths are resolved from the directory containing this namelist.
# Boolean values accept 0/1, true/false, yes/no, or on/off.
# ============================================================================

[FILES]
# Meteorological driver table stored under inputs/.
meteorology = inputs/Met_HourlyData_2012_moflux_Kc.csv

# Ecosystem emission factors and light-dependent fractions under inputs/.
emission_factors = inputs/EF_LDF.csv

# Fractions of the six MEGCAN plant functional types under inputs/.
pft_fractions = inputs/PFT_Fraction.csv

# All model products are written here.
output_directory = outputs


[MODEL]
# Number of vertical canopy layers. Five retains the calibrated quadrature.
number_of_layers = 5

# Solar and radiation-conversion constants.
solar_constant_w_m2 = 1361.5
solar_to_ppfd = 2.1

# Stress-response inputs used only when their switches are enabled.
air_quality_index = 40.0
co2_ppm = 403.0
kc_min = 0.0
kc_max = 0.82

# Used to convert modeled isoprene from nmol m-2 s-1 to mg m-2 h-1.
isoprene_molecular_weight_g_mol = 68.12


[SITE]
# RH_QV = 1 or RH: meteorology contains relative humidity in percent.
# RH_QV = 0 or QV: meteorology contains water-vapor mixing ratio in kg kg-1.
RH_QV = 1

# Site latitude in decimal degrees; north is positive.
Latitude = 45.4

# Soil wilting point used by the soil-moisture response parameterization.
WT = 0.196


[ACTIVITY_SWITCHES]
# 0 = disabled, 1 = enabled.
# Experimental stress algorithms are disabled in the default example.
GAMBD_YN = 0
GAMAQ_YN = 0
GAMHT_YN = 0
GAMLT_YN = 0
GAMHW_YN = 0
GAMSM_YN = 0
GAMCO2_YN = 0


[DIAGNOSTICS]
# Inclusive local-hour window used for observed-versus-modeled statistics.
daytime_start_hour = 9.0
daytime_end_hour = 17.0

# Save and/or interactively display the isoprene diagnostic figure.
create_diagnostic_figure = true
show_diagnostic_figure = false


[OUTPUT]
# File names are relative to FILES.output_directory unless absolute paths are
# supplied. CSV headers include physical units for every column.
all_species_filename = Moflux_2012_simulation_all.csv
isoprene_filename = Moflux_2012_simulation_isoprene.csv
metrics_filename = Moflux_2012_metrics.json
diagnostic_figure_filename = Moflux_2012_isoprene_diagnostics.png

# Numeric CSV formatting and missing-value text.
float_format = %.6f
missing_value = nan

# Preserve the exact configuration used for each run in the output directory.
copy_namelist_to_output = true
namelist_copy_filename = MEGAN_namelist_used.ini
